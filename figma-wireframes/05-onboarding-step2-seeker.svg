<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <rect id="Background" width="375" height="812" fill="#F9FAFB" rx="20"/>

  <!-- Progress Bar -->
  <g id="Progress-Bar">
    <text x="24" y="56" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">Step 2 of 2</text>
    <text x="295" y="56" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">100% Complete</text>
    <rect x="24" y="66" width="327" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="24" y="66" width="327" height="8" rx="4" fill="url(#progress)"/>
    <defs>
      <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7C3AED"/>
        <stop offset="100%" stop-color="#10B981"/>
      </linearGradient>
    </defs>
  </g>

  <!-- Card -->
  <g id="Seeker-Profile-Card">
    <rect x="20" y="95" width="335" height="580" rx="20" fill="#FFFFFF" filter="drop-shadow(0 4px 20px rgba(0,0,0,0.08))"/>

    <!-- Icon -->
    <rect x="147" y="115" width="56" height="56" rx="16" fill="#7C3AED"/>
    <text x="175" y="150" font-family="Inter, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">G</text>

    <text x="187" y="195" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="middle">Your job search profile</text>
    <text x="187" y="215" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Help us find the perfect referral opportunities</text>

    <!-- Field: Education -->
    <g id="Field-Education">
      <text x="40" y="250" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#1F2937">Education Background *</text>
      <rect x="40" y="258" width="275" height="42" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <text x="56" y="284" font-family="Inter, sans-serif" font-size="13" fill="#9CA3AF">Select your education</text>
      <text x="298" y="284" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">v</text>
    </g>

    <!-- Field: Target Domain -->
    <g id="Field-Target-Domain">
      <text x="40" y="325" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#1F2937">Target Domain *</text>
      <rect x="40" y="333" width="275" height="42" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <text x="56" y="359" font-family="Inter, sans-serif" font-size="13" fill="#9CA3AF">What field are you targeting?</text>
      <text x="298" y="359" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">v</text>
    </g>

    <!-- Field: Target Role Level -->
    <g id="Field-Role-Level">
      <text x="40" y="400" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#1F2937">Target Role Level *</text>
      <rect x="40" y="408" width="275" height="42" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <text x="56" y="434" font-family="Inter, sans-serif" font-size="13" fill="#9CA3AF">What level are you targeting?</text>
      <text x="298" y="434" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">v</text>
    </g>

    <!-- Field: Skills -->
    <g id="Field-Skills">
      <text x="40" y="480" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#1F2937">Key Skills (Optional)</text>
      <!-- Skill Tags -->
      <rect x="40" y="492" width="60" height="26" rx="13" fill="rgba(124,58,237,0.1)"/>
      <text x="70" y="509" font-family="Inter, sans-serif" font-size="11" fill="#7C3AED" text-anchor="middle">React x</text>
      <rect x="108" y="492" width="68" height="26" rx="13" fill="rgba(124,58,237,0.1)"/>
      <text x="142" y="509" font-family="Inter, sans-serif" font-size="11" fill="#7C3AED" text-anchor="middle">Python x</text>

      <!-- Input + Add -->
      <rect x="40" y="528" width="220" height="38" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <text x="56" y="552" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">Add a skill (e.g., AWS)</text>
      <rect x="268" y="528" width="48" height="38" rx="10" fill="none" stroke="#E5E7EB" stroke-width="2"/>
      <text x="292" y="552" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Add</text>
    </g>
  </g>

  <!-- Navigation -->
  <g id="Nav-Buttons">
    <rect x="24" y="700" width="80" height="44" rx="8" fill="none" stroke="#E5E7EB" stroke-width="1"/>
    <text x="64" y="727" font-family="Inter, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">&lt; Back</text>

    <rect x="200" y="700" width="150" height="44" rx="12" fill="url(#progress)"/>
    <text x="275" y="727" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Complete Setup</text>
  </g>
</svg>