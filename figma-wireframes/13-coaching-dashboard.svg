<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <rect id="Background" width="375" height="812" fill="#F9FAFB" rx="20"/>

  <!-- Header -->
  <g id="Header">
    <rect x="0" y="0" width="375" height="90" fill="#FFFFFF" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.06))"/>
    <text x="16" y="30" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1F2937">1v1 Coaching</text>
    <text x="16" y="48" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">Connect with industry professionals</text>

    <!-- Tab Buttons -->
    <rect x="16" y="60" width="120" height="24" rx="6" fill="#7C3AED"/>
    <text x="76" y="76" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Browse Mentors</text>
    <rect x="144" y="60" width="100" height="24" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1"/>
    <text x="194" y="76" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-anchor="middle">My Sessions</text>
  </g>

  <!-- Stats Cards -->
  <g id="Stats">
    <rect x="16" y="106" width="82" height="60" rx="10" fill="#FFFFFF" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="25" y="124" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">Available</text>
    <text x="25" y="146" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1F2937">24</text>
    <text x="78" y="146" font-family="Inter, sans-serif" font-size="14" fill="#10B981" text-anchor="end">U</text>

    <rect x="106" y="106" width="82" height="60" rx="10" fill="#FFFFFF" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="115" y="124" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">Upcoming</text>
    <text x="115" y="146" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1F2937">2</text>

    <rect x="196" y="106" width="82" height="60" rx="10" fill="#FFFFFF" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="205" y="124" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">Pending</text>
    <text x="205" y="146" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1F2937">1</text>

    <rect x="286" y="106" width="73" height="60" rx="10" fill="#FFFFFF" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="295" y="124" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">Success</text>
    <text x="295" y="146" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1F2937">94%</text>
  </g>

  <!-- Results Count -->
  <text x="16" y="196" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">24 mentors found</text>
  <rect x="280" y="182" width="80" height="20" rx="10" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <text x="320" y="196" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">By relevance</text>

  <!-- Mentor Card 1 -->
  <g id="Mentor-Card-1">
    <rect x="16" y="210" width="343" height="160" rx="12" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <!-- Avatar -->
    <circle cx="52" cy="246" r="20" fill="#7C3AED"/>
    <text x="52" y="252" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">AK</text>

    <text x="82" y="238" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1F2937">Anil Kumar</text>
    <text x="82" y="256" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Sr. Engineer at Google</text>
    <text x="82" y="272" font-family="Inter, sans-serif" font-size="10" fill="#9CA3AF">8 yrs exp  |  4.8 rating</text>

    <!-- Skills -->
    <rect x="32" y="290" width="44" height="20" rx="10" fill="rgba(124,58,237,0.08)"/>
    <text x="54" y="304" font-family="Inter, sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">React</text>
    <rect x="84" y="290" width="54" height="20" rx="10" fill="rgba(124,58,237,0.08)"/>
    <text x="111" y="304" font-family="Inter, sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">System</text>
    <rect x="146" y="290" width="38" height="20" rx="10" fill="rgba(124,58,237,0.08)"/>
    <text x="165" y="304" font-family="Inter, sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">Go</text>

    <text x="32" y="340" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1F2937">Rs.499/session</text>
    <rect x="240" y="324" width="100" height="32" rx="8" fill="#7C3AED"/>
    <text x="290" y="345" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Book Session</text>
  </g>

  <!-- Mentor Card 2 -->
  <g id="Mentor-Card-2">
    <rect x="16" y="386" width="343" height="160" rx="12" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <circle cx="52" cy="422" r="20" fill="#10B981"/>
    <text x="52" y="428" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">PS</text>

    <text x="82" y="414" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1F2937">Priya Sharma</text>
    <text x="82" y="432" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Product Manager at Microsoft</text>
    <text x="82" y="448" font-family="Inter, sans-serif" font-size="10" fill="#9CA3AF">5 yrs exp  |  4.6 rating</text>

    <rect x="32" y="466" width="60" height="20" rx="10" fill="rgba(124,58,237,0.08)"/>
    <text x="62" y="480" font-family="Inter, sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">Product</text>
    <rect x="100" y="466" width="58" height="20" rx="10" fill="rgba(124,58,237,0.08)"/>
    <text x="129" y="480" font-family="Inter, sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">Strategy</text>

    <text x="32" y="516" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1F2937">Rs.499/session</text>
    <rect x="240" y="500" width="100" height="32" rx="8" fill="#7C3AED"/>
    <text x="290" y="521" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Book Session</text>
  </g>

  <!-- Mentor Card 3 -->
  <g id="Mentor-Card-3">
    <rect x="16" y="562" width="343" height="160" rx="12" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <circle cx="52" cy="598" r="20" fill="#F59E0B"/>
    <text x="52" y="604" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">RJ</text>

    <text x="82" y="590" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1F2937">Rahul Jain</text>
    <text x="82" y="608" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Staff Engineer at Amazon</text>
    <text x="82" y="624" font-family="Inter, sans-serif" font-size="10" fill="#9CA3AF">12 yrs exp  |  4.9 rating</text>

    <rect x="32" y="642" width="38" height="20" rx="10" fill="rgba(124,58,237,0.08)"/>
    <text x="51" y="656" font-family="Inter, sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">Java</text>
    <rect x="78" y="642" width="44" height="20" rx="10" fill="rgba(124,58,237,0.08)"/>
    <text x="100" y="656" font-family="Inter, sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">AWS</text>
    <rect x="130" y="642" width="60" height="20" rx="10" fill="rgba(124,58,237,0.08)"/>
    <text x="160" y="656" font-family="Inter, sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">Microsvcs</text>

    <text x="32" y="692" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1F2937">Rs.499/session</text>
    <rect x="240" y="676" width="100" height="32" rx="8" fill="#7C3AED"/>
    <text x="290" y="697" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Book Session</text>
  </g>
</svg>