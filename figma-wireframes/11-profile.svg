<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <rect id="Background" width="375" height="812" fill="#F9FAFB" rx="20"/>
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Header -->
  <g id="Header">
    <rect x="0" y="0" width="375" height="52" fill="#FFFFFF" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.06))"/>
    <text x="24" y="33" font-family="Inter, sans-serif" font-size="13" fill="#6B7280">&lt; Back</text>
    <text x="187" y="33" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="middle">Profile</text>
  </g>

  <!-- Profile Card -->
  <g id="Profile-Card">
    <rect x="16" y="68" width="343" height="200" rx="16" fill="#FFFFFF" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.06))"/>

    <!-- Avatar -->
    <circle cx="187" cy="120" r="40" fill="url(#avatar)" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="187" cy="120" r="36" fill="#FFFFFF"/>
    <circle cx="187" cy="120" r="34" fill="url(#avatar)"/>
    <text x="187" y="128" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">R</text>

    <text x="187" y="182" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="middle">Rehan Yadav</text>
    <text x="187" y="202" font-family="Inter, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">rehan@example.com</text>

    <!-- Role Badge -->
    <rect x="143" y="216" width="88" height="26" rx="13" fill="rgba(124,58,237,0.08)" stroke="#7C3AED" stroke-width="1"/>
    <text x="187" y="234" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#7C3AED" text-anchor="middle">Seeker &amp; Referrer</text>
  </g>

  <!-- Information Card -->
  <g id="Info-Card">
    <rect x="16" y="284" width="343" height="160" rx="16" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <text x="32" y="314" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#1F2937">Information</text>

    <!-- Email -->
    <text x="60" y="345" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#1F2937">Email</text>
    <text x="60" y="360" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">rehan@example.com</text>

    <!-- Company -->
    <text x="60" y="390" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#1F2937">Company</text>
    <text x="60" y="405" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">TCS</text>

    <!-- Member Since -->
    <text x="60" y="430" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#1F2937">Member Since</text>
    <text x="60" y="445" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">4/24/2026</text>
  </g>

  <!-- Account Card -->
  <g id="Account-Card">
    <rect x="16" y="460" width="343" height="140" rx="16" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <text x="32" y="490" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#1F2937">Account</text>

    <!-- Profile Settings -->
    <rect x="32" y="506" width="311" height="38" rx="8" fill="none" stroke="#E5E7EB" stroke-width="1"/>
    <text x="56" y="530" font-family="Inter, sans-serif" font-size="13" fill="#1F2937">Profile Settings</text>

    <!-- Sign Out -->
    <rect x="32" y="552" width="311" height="38" rx="8" fill="none" stroke="#FCA5A5" stroke-width="1"/>
    <text x="56" y="576" font-family="Inter, sans-serif" font-size="13" fill="#EF4444">Sign Out</text>
  </g>
</svg>