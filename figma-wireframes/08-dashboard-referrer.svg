<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <rect id="Background" width="375" height="812" fill="#F9FAFB" rx="20"/>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Header -->
  <g id="Header">
    <rect x="0" y="0" width="375" height="60" fill="#FFFFFF" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.06))"/>
    <rect x="16" y="14" width="32" height="32" rx="8" fill="#7C3AED"/>
    <text x="32" y="35" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">JT</text>
    <text x="56" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1F2937">Job Thrive</text>

    <!-- Role Toggle - Referrer active -->
    <g id="Role-Toggle">
      <rect x="148" y="14" width="130" height="32" rx="16" fill="#F3F4F6"/>
      <text x="180" y="35" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-anchor="middle">Seeker</text>
      <rect x="216" y="16" width="60" height="28" rx="14" fill="#7C3AED"/>
      <text x="246" y="35" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Referrer</text>
    </g>

    <circle cx="343" cy="30" r="16" fill="url(#green)"/>
    <text x="343" y="35" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">R</text>
  </g>

  <!-- Earnings Card -->
  <g id="Earnings-Card">
    <rect x="16" y="76" width="343" height="170" rx="16" fill="url(#green)"/>
    <text x="32" y="104" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Rehan Yadav</text>
    <text x="32" y="122" font-family="Inter, sans-serif" font-size="13" fill="rgba(255,255,255,0.9)">Your referral earnings</text>

    <text x="330" y="104" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="end">Rs.4,500</text>
    <text x="330" y="120" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="end">Total Earned</text>

    <!-- Sub stats -->
    <rect x="32" y="145" width="147" height="56" rx="12" fill="rgba(255,255,255,0.2)"/>
    <text x="105" y="168" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rs.1,500</text>
    <text x="105" y="186" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.75)" text-anchor="middle">This Month</text>

    <rect x="191" y="145" width="147" height="56" rx="12" fill="rgba(255,255,255,0.2)"/>
    <text x="264" y="168" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
    <text x="264" y="186" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.75)" text-anchor="middle">Successful</text>
  </g>

  <!-- Quick Stats -->
  <g id="Quick-Stats">
    <rect x="16" y="262" width="107" height="72" rx="12" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <text x="69" y="292" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="middle">3</text>
    <text x="69" y="310" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Pending</text>

    <rect x="133" y="262" width="107" height="72" rx="12" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <text x="186" y="292" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#10B981" text-anchor="middle">9</text>
    <text x="186" y="310" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Completed</text>

    <rect x="250" y="262" width="107" height="72" rx="12" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <text x="303" y="292" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#7C3AED" text-anchor="middle">75%</text>
    <text x="303" y="310" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Success Rate</text>
  </g>

  <!-- Assigned Referrals -->
  <g id="Assigned-Referrals">
    <text x="16" y="365" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#1F2937">Assigned Referrals</text>

    <!-- Card -->
    <rect x="16" y="380" width="343" height="110" rx="12" fill="#FFFFFF" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="32" y="404" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1F2937">Frontend Developer</text>
    <text x="32" y="422" font-family="Inter, sans-serif" font-size="12" fill="#7C3AED">Flipkart</text>
    <text x="32" y="440" font-family="Inter, sans-serif" font-size="10" fill="#6B7280">Seeker: Priya Sharma</text>
    <rect x="280" y="396" width="60" height="22" rx="11" fill="rgba(124,58,237,0.1)"/>
    <text x="310" y="411" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#7C3AED" text-anchor="middle">Assigned</text>
    <!-- Action buttons -->
    <rect x="32" y="454" width="120" height="28" rx="8" fill="#7C3AED"/>
    <text x="92" y="473" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Upload Proof</text>
    <rect x="162" y="454" width="80" height="28" rx="8" fill="none" stroke="#EF4444" stroke-width="1"/>
    <text x="202" y="473" font-family="Inter, sans-serif" font-size="11" fill="#EF4444" text-anchor="middle">Decline</text>
  </g>

  <!-- Completed Referrals -->
  <g id="Completed-Referrals">
    <text x="16" y="525" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#1F2937">Completed Referrals</text>

    <rect x="16" y="540" width="343" height="70" rx="12" fill="#FFFFFF" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="32" y="564" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1F2937">Backend Engineer</text>
    <text x="32" y="582" font-family="Inter, sans-serif" font-size="12" fill="#7C3AED">Amazon</text>
    <text x="32" y="598" font-family="Inter, sans-serif" font-size="10" fill="#6B7280">Completed 3d ago</text>
    <rect x="270" y="556" width="72" height="22" rx="11" fill="rgba(16,185,129,0.1)"/>
    <text x="306" y="571" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#10B981" text-anchor="middle">Completed</text>
    <text x="320" y="598" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="end">+Rs.499</text>
  </g>

  <!-- Bottom Navigation -->
  <g id="Bottom-Nav">
    <rect x="0" y="740" width="375" height="72" fill="#FFFFFF" filter="drop-shadow(0 -1px 3px rgba(0,0,0,0.06))"/>
    <text x="187" y="756" font-family="Inter, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle" text-decoration="underline">Terms   Privacy   Refund</text>
    <text x="58" y="798" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#7C3AED" text-anchor="middle">Dashboard</text>
    <text x="187" y="798" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" text-anchor="middle">Search</text>
    <text x="316" y="798" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" text-anchor="middle">Profile</text>
  </g>
</svg>