<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect id="Background" width="375" height="812" fill="url(#bg)" rx="20"/>

  <!-- Progress Dots -->
  <g id="Progress-Dots">
    <circle cx="178" cy="60" r="5" fill="#FFFFFF"/>
    <circle cx="197" cy="60" r="5" fill="rgba(255,255,255,0.3)"/>
    <text x="187" y="82" font-family="Inter, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Step 1 of 2</text>
  </g>

  <!-- Title -->
  <g id="Title-Section">
    <text x="187" y="120" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Welcome to Job Thrive</text>
    <text x="187" y="148" font-family="Inter, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">The future of job referrals</text>
  </g>

  <!-- Logo -->
  <g id="Logo">
    <rect x="147" y="170" width="80" height="80" rx="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="187" y="218" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">JT</text>
  </g>

  <text x="187" y="290" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Transform Your Career Journey</text>
  <text x="187" y="316" font-family="Inter, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">Connect, refer, and earn in the world's most</text>
  <text x="187" y="334" font-family="Inter, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">advanced referral marketplace</text>

  <!-- Feature Cards -->
  <g id="Card-Find-Jobs">
    <rect x="20" y="365" width="105" height="140" rx="16" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.1))"/>
    <rect x="42" y="385" width="40" height="40" rx="10" fill="#7C3AED"/>
    <text x="62" y="410" font-family="Inter, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">S</text>
    <text x="72" y="445" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Find Dream</text>
    <text x="72" y="460" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Jobs</text>
    <text x="72" y="480" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Discover exclusive</text>
    <text x="72" y="492" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">opportunities</text>
  </g>

  <g id="Card-Get-Consulted">
    <rect x="135" y="365" width="105" height="140" rx="16" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.1))"/>
    <rect x="157" y="385" width="40" height="40" rx="10" fill="#10B981"/>
    <text x="177" y="410" font-family="Inter, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">U</text>
    <text x="187" y="445" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Get</text>
    <text x="187" y="460" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Consulted</text>
    <text x="187" y="480" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">1-on-1 guidance from</text>
    <text x="187" y="492" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">professionals</text>
  </g>

  <g id="Card-Earn-Money">
    <rect x="250" y="365" width="105" height="140" rx="16" fill="#FFFFFF" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.1))"/>
    <rect x="272" y="385" width="40" height="40" rx="10" fill="#F59E0B"/>
    <text x="292" y="410" font-family="Inter, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">R</text>
    <text x="302" y="445" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Earn</text>
    <text x="302" y="460" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Money</text>
    <text x="302" y="480" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Mentor talent and</text>
    <text x="302" y="492" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">earn rewards</text>
  </g>

  <!-- Navigation Buttons -->
  <g id="Nav-Buttons">
    <text x="50" y="570" font-family="Inter, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">Previous</text>
    <rect x="245" y="550" width="110" height="44" rx="16" fill="#FFFFFF"/>
    <text x="290" y="577" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#7C3AED" text-anchor="middle">Next  ></text>
  </g>

  <!-- Footer Links -->
  <g id="Footer-Links">
    <text x="187" y="640" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">By continuing, you agree to our Terms, Privacy, and Refund Policy</text>
  </g>
</svg>