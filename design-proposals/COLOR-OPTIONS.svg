<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#09090B"/>
  <text x="60" y="50" font-family="Inter, system-ui" font-size="20" font-weight="800" fill="#FAFAFA">Pick a vibe — 3 fresh palettes</text>
  <text x="60" y="75" font-family="Inter, system-ui" font-size="12" fill="#52525B">All dark-first. No gradients overload. Clean, modern, 2025.</text>

  <!-- ═══ OPTION 1: Monochrome + Blue (Linear/Vercel) ═══ -->
  <g transform="translate(60, 110)">
    <text x="0" y="0" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#FAFAFA">A — "Clean Machine"</text>
    <text x="0" y="20" font-family="Inter, system-ui" font-size="11" fill="#52525B">Inspired by: Linear + Vercel. Near-black, single blue accent. Ultra minimal.</text>

    <!-- Palette -->
    <rect x="0" y="36" width="44" height="32" rx="6" fill="#09090B" stroke="#27272A" stroke-width="1"/>
    <rect x="50" y="36" width="44" height="32" rx="6" fill="#111113"/>
    <rect x="100" y="36" width="44" height="32" rx="6" fill="#18181B"/>
    <rect x="150" y="36" width="44" height="32" rx="6" fill="#5B5BD6"/>
    <rect x="200" y="36" width="44" height="32" rx="6" fill="#3B82F6"/>
    <rect x="250" y="36" width="44" height="32" rx="6" fill="#22C55E"/>
    <rect x="300" y="36" width="44" height="32" rx="6" fill="#FAFAFA"/>
    <text x="0" y="84" font-family="Inter, mono" font-size="8" fill="#3F3F46">Base       Surface    Card       Primary    Links      Success    Text</text>

    <!-- Mini mockup -->
    <rect x="0" y="100" width="340" height="200" rx="12" fill="#09090B" stroke="#27272A" stroke-width="1"/>
    <!-- Header -->
    <rect x="1" y="101" width="338" height="36" rx="11" fill="#111113"/>
    <rect x="12" y="110" width="18" height="18" rx="5" fill="#5B5BD6"/>
    <text x="36" y="124" font-family="Inter, system-ui" font-size="11" font-weight="800" fill="#FAFAFA">jobthrive</text>
    <!-- Card -->
    <rect x="12" y="148" width="316" height="56" rx="8" fill="#18181B"/>
    <rect x="12" y="148" width="316" height="2" rx="1" fill="#5B5BD6"/>
    <text x="24" y="168" font-family="Inter, system-ui" font-size="10" fill="#52525B" letter-spacing="1">WELCOME BACK</text>
    <text x="24" y="186" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#FAFAFA">Rehan Yadav</text>
    <rect x="240" y="164" width="76" height="24" rx="6" fill="#5B5BD6"/>
    <text x="278" y="180" font-family="Inter, system-ui" font-size="10" font-weight="700" fill="white" text-anchor="middle">Find Jobs</text>
    <!-- Stats -->
    <rect x="12" y="216" width="100" height="36" rx="6" fill="#18181B"/>
    <text x="62" y="240" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#FAFAFA" text-anchor="middle">95</text>
    <rect x="120" y="216" width="100" height="36" rx="6" fill="#18181B"/>
    <text x="170" y="240" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#22C55E" text-anchor="middle">3</text>
    <rect x="228" y="216" width="100" height="36" rx="6" fill="#18181B"/>
    <text x="278" y="240" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#3B82F6" text-anchor="middle">1</text>
    <!-- Job card -->
    <rect x="12" y="262" width="316" height="30" rx="6" fill="#18181B"/>
    <rect x="12" y="262" width="2" height="30" rx="1" fill="#5B5BD6"/>
    <text x="24" y="281" font-family="Inter, system-ui" font-size="10" font-weight="600" fill="#FAFAFA">Sr. Engineer · Google</text>
    <text x="300" y="281" font-family="Inter, system-ui" font-size="10" font-weight="700" fill="#22C55E" text-anchor="end">Rs.499</text>

    <text x="0" y="330" font-family="Inter, system-ui" font-size="10" fill="#52525B">Feels: Professional, trustworthy, dev-tool quality. No flash, all substance.</text>
  </g>

  <!-- ═══ OPTION 2: Warm Dark + Indigo (Mercury/Arc) ═══ -->
  <g transform="translate(430, 110)">
    <text x="0" y="0" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#FAFAFA">B — "Warm Professional"</text>
    <text x="0" y="20" font-family="Inter, system-ui" font-size="11" fill="#52525B">Inspired by: Mercury + Arc. Warm dark navy, indigo + teal. Sophisticated.</text>

    <!-- Palette -->
    <rect x="0" y="36" width="44" height="32" rx="6" fill="#0A1120" stroke="#1A2840" stroke-width="1"/>
    <rect x="50" y="36" width="44" height="32" rx="6" fill="#0F1A2E"/>
    <rect x="100" y="36" width="44" height="32" rx="6" fill="#162236"/>
    <rect x="150" y="36" width="44" height="32" rx="6" fill="#6366F1"/>
    <rect x="200" y="36" width="44" height="32" rx="6" fill="#14B8A6"/>
    <rect x="250" y="36" width="44" height="32" rx="6" fill="#F97316"/>
    <rect x="300" y="36" width="44" height="32" rx="6" fill="#F1F5F9"/>
    <text x="0" y="84" font-family="Inter, mono" font-size="8" fill="#3F3F46">Base       Surface    Card       Indigo     Teal       Warning    Text</text>

    <!-- Mini mockup -->
    <rect x="0" y="100" width="340" height="200" rx="12" fill="#0A1120" stroke="#1A2840" stroke-width="1"/>
    <rect x="1" y="101" width="338" height="36" rx="11" fill="#0F1A2E"/>
    <rect x="12" y="110" width="18" height="18" rx="5" fill="#6366F1"/>
    <text x="36" y="124" font-family="Inter, system-ui" font-size="11" font-weight="800" fill="#F1F5F9">jobthrive</text>

    <rect x="12" y="148" width="316" height="56" rx="8" fill="#162236"/>
    <rect x="12" y="148" width="316" height="2" rx="1" fill="#6366F1"/>
    <text x="24" y="168" font-family="Inter, system-ui" font-size="10" fill="#5A7A9A" letter-spacing="1">WELCOME BACK</text>
    <text x="24" y="186" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#F1F5F9">Rehan Yadav</text>
    <rect x="240" y="164" width="76" height="24" rx="6" fill="#6366F1"/>
    <text x="278" y="180" font-family="Inter, system-ui" font-size="10" font-weight="700" fill="white" text-anchor="middle">Find Jobs</text>

    <rect x="12" y="216" width="100" height="36" rx="6" fill="#162236"/>
    <text x="62" y="240" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#F1F5F9" text-anchor="middle">95</text>
    <rect x="120" y="216" width="100" height="36" rx="6" fill="#162236"/>
    <text x="170" y="240" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#14B8A6" text-anchor="middle">3</text>
    <rect x="228" y="216" width="100" height="36" rx="6" fill="#162236"/>
    <text x="278" y="240" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#6366F1" text-anchor="middle">1</text>

    <rect x="12" y="262" width="316" height="30" rx="6" fill="#162236"/>
    <rect x="12" y="262" width="2" height="30" rx="1" fill="#14B8A6"/>
    <text x="24" y="281" font-family="Inter, system-ui" font-size="10" font-weight="600" fill="#F1F5F9">Sr. Engineer · Google</text>
    <text x="300" y="281" font-family="Inter, system-ui" font-size="10" font-weight="700" fill="#14B8A6" text-anchor="end">Rs.499</text>

    <text x="0" y="330" font-family="Inter, system-ui" font-size="10" fill="#5A7A9A">Feels: Banking-grade, warm, trustworthy with money. Premium fintech vibes.</text>
  </g>

  <!-- ═══ OPTION 3: Neutral Dark + Lime (Raycast/Figma) ═══ -->
  <g transform="translate(800, 110)">
    <text x="0" y="0" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#FAFAFA">C — "Electric Focus"</text>
    <text x="0" y="20" font-family="Inter, system-ui" font-size="11" fill="#52525B">Inspired by: Raycast + Figma. Neutral dark, electric lime accent. Bold.</text>

    <!-- Palette -->
    <rect x="0" y="36" width="44" height="32" rx="6" fill="#0C0C0C" stroke="#1F1F1F" stroke-width="1"/>
    <rect x="50" y="36" width="44" height="32" rx="6" fill="#141414"/>
    <rect x="100" y="36" width="44" height="32" rx="6" fill="#1C1C1C"/>
    <rect x="150" y="36" width="44" height="32" rx="6" fill="#A3E635"/>
    <rect x="200" y="36" width="44" height="32" rx="6" fill="#818CF8"/>
    <rect x="250" y="36" width="44" height="32" rx="6" fill="#FB923C"/>
    <rect x="300" y="36" width="44" height="32" rx="6" fill="#F5F5F5"/>
    <text x="0" y="84" font-family="Inter, mono" font-size="8" fill="#3F3F46">Base       Surface    Card       Lime       Violet     Warning    Text</text>

    <!-- Mini mockup -->
    <rect x="0" y="100" width="340" height="200" rx="12" fill="#0C0C0C" stroke="#1F1F1F" stroke-width="1"/>
    <rect x="1" y="101" width="338" height="36" rx="11" fill="#141414"/>
    <rect x="12" y="110" width="18" height="18" rx="5" fill="#A3E635"/>
    <text x="36" y="124" font-family="Inter, system-ui" font-size="11" font-weight="800" fill="#F5F5F5">jobthrive</text>

    <rect x="12" y="148" width="316" height="56" rx="8" fill="#1C1C1C"/>
    <rect x="12" y="148" width="316" height="2" rx="1" fill="#A3E635"/>
    <text x="24" y="168" font-family="Inter, system-ui" font-size="10" fill="#525252" letter-spacing="1">WELCOME BACK</text>
    <text x="24" y="186" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#F5F5F5">Rehan Yadav</text>
    <rect x="240" y="164" width="76" height="24" rx="6" fill="#A3E635"/>
    <text x="278" y="180" font-family="Inter, system-ui" font-size="10" font-weight="700" fill="#0C0C0C" text-anchor="middle">Find Jobs</text>

    <rect x="12" y="216" width="100" height="36" rx="6" fill="#1C1C1C"/>
    <text x="62" y="240" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#F5F5F5" text-anchor="middle">95</text>
    <rect x="120" y="216" width="100" height="36" rx="6" fill="#1C1C1C"/>
    <text x="170" y="240" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#A3E635" text-anchor="middle">3</text>
    <rect x="228" y="216" width="100" height="36" rx="6" fill="#1C1C1C"/>
    <text x="278" y="240" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#818CF8" text-anchor="middle">1</text>

    <rect x="12" y="262" width="316" height="30" rx="6" fill="#1C1C1C"/>
    <rect x="12" y="262" width="2" height="30" rx="1" fill="#A3E635"/>
    <text x="24" y="281" font-family="Inter, system-ui" font-size="10" font-weight="600" fill="#F5F5F5">Sr. Engineer · Google</text>
    <text x="300" y="281" font-family="Inter, system-ui" font-size="10" font-weight="700" fill="#A3E635" text-anchor="end">Rs.499</text>

    <text x="0" y="330" font-family="Inter, system-ui" font-size="10" fill="#525252">Feels: Energetic, startup, young, Silicon Valley. Stands out from every job site.</text>
  </g>

  <!-- ═══ COMPARISON ═══ -->
  <g transform="translate(60, 520)">
    <text x="0" y="0" font-family="Inter, system-ui" font-size="14" font-weight="800" fill="#FAFAFA">Quick comparison</text>

    <text x="0" y="35" font-family="Inter, system-ui" font-size="11" font-weight="700" fill="#52525B">A — Clean Machine</text>
    <text x="200" y="35" font-family="Inter, system-ui" font-size="11" fill="#71717A">Most professional. Like using Linear. Best for trust.</text>

    <text x="0" y="60" font-family="Inter, system-ui" font-size="11" font-weight="700" fill="#52525B">B — Warm Professional</text>
    <text x="200" y="60" font-family="Inter, system-ui" font-size="11" fill="#71717A">Banking feel. Warm navy tones. Best when money is involved.</text>

    <text x="0" y="85" font-family="Inter, system-ui" font-size="11" font-weight="700" fill="#52525B">C — Electric Focus</text>
    <text x="200" y="85" font-family="Inter, system-ui" font-size="11" fill="#71717A">Most unique. Lime green on black. Nobody else looks like this.</text>

    <text x="0" y="120" font-family="Inter, system-ui" font-size="12" font-weight="800" fill="#A3E635">My recommendation: B or C</text>
    <text x="0" y="140" font-family="Inter, system-ui" font-size="11" fill="#52525B">B if you want "I trust this with my money" vibes. C if you want "this is different from every job site".</text>
    <text x="0" y="158" font-family="Inter, system-ui" font-size="11" fill="#52525B">A is safe but might feel too similar to dev tools. Users might not realize it's a job platform.</text>
  </g>
</svg>