  <rect x="476" y="870" width="3" height="76" rx="1.5" fill="#1DB954"/>
  <rect x="496" y="884" width="36" height="36" rx="10" fill="#222"/>
  <text x="514" y="908" font-family="Inter, system-ui" font-size="13" font-weight="700" fill="#555" text-anchor="middle">M</text>
