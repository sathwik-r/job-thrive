  <text x="860" y="610" font-family="Inter, system-ui" font-size="12" fill="#555">- Left accent bars on list items</text>
  <text x="860" y="630" font-family="Inter, system-ui" font-size="12" fill="#555">- Lowercase brand name "jobthrive"</text>
  <text x="860" y="650" font-family="Inter, system-ui" font-size="12" fill="#555">- Feels: energetic, bold, young, modern</text>
  <text x="860" y="680" font-family="Inter, system-ui" font-size="12" font-weight="600" fill="#1DB954">Best for: young professionals, startup vibe</text>
