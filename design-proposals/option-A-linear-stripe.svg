<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <!-- Background -->
  <rect width="1200" height="1800" fill="#09090B"/>

  <!-- Title -->
  <text x="60" y="60" font-family="Inter, system-ui" font-size="24" font-weight="700" fill="#A1A1AA">OPTION A</text>
  <text x="60" y="95" font-family="Inter, system-ui" font-size="16" fill="#52525B">Inspired by: Linear + Stripe + Vercel</text>
  <text x="60" y="120" font-family="Inter, system-ui" font-size="14" fill="#3F3F46">Dark-first, premium, sharp edges, gradient accents</text>

  <!-- Color Palette -->
  <text x="60" y="170" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#71717A">COLOR PALETTE</text>
  <rect x="60" y="185" width="60" height="40" rx="8" fill="#09090B" stroke="#27272A" stroke-width="1"/>
  <text x="90" y="240" font-family="Inter, mono" font-size="9" fill="#52525B" text-anchor="middle">Base</text>
  <rect x="130" y="185" width="60" height="40" rx="8" fill="#18181B"/>
  <text x="160" y="240" font-family="Inter, mono" font-size="9" fill="#52525B" text-anchor="middle">Surface</text>
  <rect x="200" y="185" width="60" height="40" rx="8" fill="#6D5BF7"/>
  <text x="230" y="240" font-family="Inter, mono" font-size="9" fill="#52525B" text-anchor="middle">Primary</text>
  <rect x="270" y="185" width="60" height="40" rx="8" fill="#34D399"/>
  <text x="300" y="240" font-family="Inter, mono" font-size="9" fill="#52525B" text-anchor="middle">Success</text>
  <rect x="340" y="185" width="60" height="40" rx="8" fill="#FAFAFA"/>
  <text x="370" y="240" font-family="Inter, mono" font-size="9" fill="#52525B" text-anchor="middle">Text</text>
  <rect x="410" y="185" width="60" height="40" rx="8" fill="#27272A"/>
  <text x="440" y="240" font-family="Inter, mono" font-size="9" fill="#52525B" text-anchor="middle">Border</text>

  <!-- LOGO CONCEPT -->
  <text x="60" y="290" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#71717A">LOGO CONCEPT — "JT" Monogram</text>

  <!-- Logo on dark bg -->
  <rect x="60" y="310" width="280" height="120" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <!-- Logo mark: overlapping J and T with gradient -->
  <defs>
    <linearGradient id="logoGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D5BF7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect x="85" y="340" width="48" height="48" rx="12" fill="url(#logoGradA)"/>
  <!-- J letter -->
  <path d="M101 355 L101 373 Q101 379 107 379" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- T letter -->
  <line x1="115" y1="355" x2="127" y2="355" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="121" y1="355" x2="121" y2="379" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Text -->
  <text x="148" y="372" font-family="Inter, system-ui" font-size="22" font-weight="800" fill="#FAFAFA" letter-spacing="-0.5">JobThrive</text>

  <!-- Logo on light variant -->
  <rect x="370" y="310" width="280" height="120" rx="12" fill="#FAFAFA"/>
  <rect x="395" y="340" width="48" height="48" rx="12" fill="url(#logoGradA)"/>
  <path d="M411 355 L411 373 Q411 379 417 379" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <line x1="425" y1="355" x2="437" y2="355" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="431" y1="355" x2="431" y2="379" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <text x="458" y="372" font-family="Inter, system-ui" font-size="22" font-weight="800" fill="#09090B" letter-spacing="-0.5">JobThrive</text>

  <!-- UI MOCKUP: Login Screen -->
  <text x="60" y="470" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#71717A">LOGIN SCREEN</text>

  <!-- Phone frame -->
  <rect x="60" y="490" width="340" height="700" rx="24" fill="#09090B" stroke="#27272A" stroke-width="1.5"/>

  <!-- Subtle grid pattern -->
  <line x1="60" y1="590" x2="400" y2="590" stroke="#18181B" stroke-width="0.5"/>
  <line x1="60" y1="690" x2="400" y2="690" stroke="#18181B" stroke-width="0.5"/>
  <line x1="60" y1="790" x2="400" y2="790" stroke="#18181B" stroke-width="0.5"/>
  <line x1="160" y1="490" x2="160" y2="1190" stroke="#18181B" stroke-width="0.5"/>
  <line x1="260" y1="490" x2="260" y2="1190" stroke="#18181B" stroke-width="0.5"/>

  <!-- Gradient orb -->
