  <rect x="476" y="506" width="28" height="28" rx="8" fill="url(#logoGradA)" opacity="0.9"/>
  <text x="514" y="525" font-family="Inter, system-ui" font-size="14" font-weight="700" fill="#FAFAFA">JobThrive</text>
  <!-- Role toggle -->
  <rect x="630" y="508" width="100" height="24" rx="12" fill="#27272A"/>
  <rect x="632" y="510" width="48" height="20" rx="10" fill="#6D5BF7"/>
  <text x="656" y="524" font-family="Inter, system-ui" font-size="9" font-weight="600" fill="white" text-anchor="middle">Seeker</text>
  <text x="706" y="524" font-family="Inter, system-ui" font-size="9" font-weight="500" fill="#52525B" text-anchor="middle">Referrer</text>
  <!-- Avatar -->
  <circle cx="770" cy="520" r="12" fill="url(#logoGradA)" opacity="0.6"/>

  <!-- Welcome card with gradient border -->
  <rect x="476" y="562" width="308" height="110" rx="14" fill="#18181B" stroke="url(#logoGradA)" stroke-width="1"/>
  <text x="492" y="588" font-family="Inter, system-ui" font-size="11" fill="#52525B" letter-spacing="1">WELCOME BACK</text>
  <text x="492" y="612" font-family="Inter, system-ui" font-size="18" font-weight="700" fill="#FAFAFA">Rehan Yadav</text>
  <!-- CTA button -->
