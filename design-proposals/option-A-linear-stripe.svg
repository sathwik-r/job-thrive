  <!-- Footer links -->
  <text x="230" y="960" font-family="Inter, system-ui" font-size="10" fill="#3F3F46" text-anchor="middle">Terms · Privacy · Refund</text>

  <!-- UI MOCKUP: Dashboard -->
  <text x="460" y="470" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#71717A">DASHBOARD</text>

  <!-- Phone frame -->
  <rect x="460" y="490" width="340" height="700" rx="24" fill="#09090B" stroke="#27272A" stroke-width="1.5"/>

  <!-- Header -->
