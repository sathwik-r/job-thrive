  <!-- Logo centered -->
  <rect x="194" y="610" width="52" height="52" rx="14" fill="url(#logoGradA)"/>
  <path d="M210 625 L210 643 Q210 649 216 649" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  <line x1="224" y1="625" x2="234" y2="625" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="229" y1="625" x2="229" y2="649" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <text x="230" y="700" font-family="Inter, system-ui" font-size="26" font-weight="800" fill="#FAFAFA" text-anchor="middle" letter-spacing="-1">JobThrive</text>
  <text x="230" y="724" font-family="Inter, system-ui" font-size="13" fill="#52525B" text-anchor="middle">Your career, amplified.</text>

  <!-- Login card -->
  <rect x="80" y="760" width="280" height="160" rx="16" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <!-- Google button -->
  <rect x="100" y="790" width="240" height="48" rx="10" fill="#FAFAFA"/>
  <circle cx="128" cy="814" r="10" fill="none" stroke="#E4E4E7" stroke-width="1"/>
  <text x="128" y="819" font-family="Inter, system-ui" font-size="13" font-weight="600" fill="#4285F4" text-anchor="middle">G</text>
  <text x="220" y="819" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#09090B" text-anchor="middle">Continue with Google</text>

  <text x="220" y="870" font-family="Inter, system-ui" font-size="10" fill="#3F3F46" text-anchor="middle">or</text>

