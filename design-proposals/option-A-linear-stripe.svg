  <text x="630" y="651" font-family="Inter, system-ui" font-size="12" font-weight="600" fill="white" text-anchor="middle">Find Jobs</text>

  <!-- Stats -->
  <rect x="476" y="686" width="98" height="64" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="525" y="710" font-family="Inter, system-ui" font-size="22" font-weight="800" fill="#FAFAFA" text-anchor="middle">95</text>
  <text x="525" y="728" font-family="Inter, system-ui" font-size="9" fill="#52525B" text-anchor="middle" letter-spacing="0.5">JOBS</text>

  <rect x="582" y="686" width="98" height="64" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="631" y="710" font-family="Inter, system-ui" font-size="22" font-weight="800" fill="#34D399" text-anchor="middle">3</text>
  <text x="631" y="728" font-family="Inter, system-ui" font-size="9" fill="#52525B" text-anchor="middle" letter-spacing="0.5">APPLIED</text>

  <rect x="688" y="686" width="98" height="64" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="737" y="710" font-family="Inter, system-ui" font-size="22" font-weight="800" fill="#6D5BF7" text-anchor="middle">1</text>
  <text x="737" y="728" font-family="Inter, system-ui" font-size="9" fill="#52525B" text-anchor="middle" letter-spacing="0.5">SUCCESS</text>

  <!-- Job card -->
  <text x="476" y="780" font-family="Inter, system-ui" font-size="12" font-weight="600" fill="#71717A" letter-spacing="0.5">ACTIVE REFERRALS</text>
  <rect x="476" y="794" width="308" height="76" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <circle cx="502" cy="822" r="14" fill="#27272A"/>
  <text x="502" y="827" font-family="Inter, system-ui" font-size="9" font-weight="600" fill="#71717A" text-anchor="middle">G</text>
  <text x="526" y="818" font-family="Inter, system-ui" font-size="13" font-weight="600" fill="#FAFAFA">Sr. Software Engineer</text>
  <text x="526" y="834" font-family="Inter, system-ui" font-size="10" fill="#52525B">Google · Bangalore</text>
  <rect x="526" y="844" width="52" height="16" rx="8" fill="#6D5BF720"/>
  <text x="552" y="855" font-family="Inter, system-ui" font-size="8" font-weight="600" fill="#6D5BF7" text-anchor="middle">Pending</text>
  <text x="762" y="834" font-family="Inter, system-ui" font-size="12" font-weight="700" fill="#FAFAFA" text-anchor="end">Rs.499</text>

  <!-- Another job card -->
  <rect x="476" y="880" width="308" height="76" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <circle cx="502" cy="908" r="14" fill="#27272A"/>
  <text x="502" y="913" font-family="Inter, system-ui" font-size="9" font-weight="600" fill="#71717A" text-anchor="middle">M</text>
  <text x="526" y="904" font-family="Inter, system-ui" font-size="13" font-weight="600" fill="#FAFAFA">Product Manager</text>
  <text x="526" y="920" font-family="Inter, system-ui" font-size="10" fill="#52525B">Microsoft · Hyderabad</text>
  <rect x="526" y="930" width="56" height="16" rx="8" fill="#34D39920"/>
  <text x="554" y="941" font-family="Inter, system-ui" font-size="8" font-weight="600" fill="#34D399" text-anchor="middle">Assigned</text>
  <text x="762" y="920" font-family="Inter, system-ui" font-size="12" font-weight="700" fill="#FAFAFA" text-anchor="end">Rs.499</text>

  <!-- Bottom nav -->
  <rect x="460" y="1140" width="340" height="50" rx="0" fill="#18181B"/>
  <rect x="460" y="1140" width="340" height="1" fill="#27272A"/>
  <text x="530" y="1172" font-family="Inter, system-ui" font-size="9" font-weight="600" fill="#6D5BF7" text-anchor="middle">Home</text>
  <text x="630" y="1172" font-family="Inter, system-ui" font-size="9" font-weight="500" fill="#52525B" text-anchor="middle">Search</text>
  <text x="730" y="1172" font-family="Inter, system-ui" font-size="9" font-weight="500" fill="#52525B" text-anchor="middle">Profile</text>

  <!-- TRAITS -->
  <text x="860" y="500" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#71717A">TRAITS</text>
  <text x="860" y="530" font-family="Inter, system-ui" font-size="12" fill="#52525B">- Dark-first design</text>
  <text x="860" y="550" font-family="Inter, system-ui" font-size="12" fill="#52525B">- Purple-to-green gradient accents</text>
  <text x="860" y="570" font-family="Inter, system-ui" font-size="12" fill="#52525B">- Tight spacing, data-dense</text>
  <text x="860" y="590" font-family="Inter, system-ui" font-size="12" fill="#52525B">- Subtle grid lines in bg</text>
  <text x="860" y="610" font-family="Inter, system-ui" font-size="12" fill="#52525B">- Gradient borders on focus cards</text>
  <text x="860" y="630" font-family="Inter, system-ui" font-size="12" fill="#52525B">- Ultra-minimal, no decorations</text>
  <text x="860" y="650" font-family="Inter, system-ui" font-size="12" fill="#52525B">- Mono-weight typography</text>
  <text x="860" y="670" font-family="Inter, system-ui" font-size="12" fill="#52525B">- Feels: premium, dev-tool, sharp</text>
  <text x="860" y="700" font-family="Inter, system-ui" font-size="12" font-weight="600" fill="#6D5BF7">Best for: tech-savvy audience</text>
</svg>