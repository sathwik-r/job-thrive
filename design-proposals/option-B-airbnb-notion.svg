  <rect x="461" y="491" width="338" height="50" rx="27" fill="#FFFFFF"/>
  <circle cx="490" cy="516" r="10" fill="url(#coralGrad)" opacity="0.15"/>
  <circle cx="490" cy="511" r="4" fill="#FF5A5F"/>
  <path d="M484 523 Q490 510 496 523" stroke="#FF5A5F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <text x="508" y="521" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A1A1A">JobThrive</text>
  <!-- Toggle -->
  <rect x="630" y="504" width="100" height="24" rx="12" fill="#E8E5E0"/>
  <rect x="632" y="506" width="48" height="20" rx="10" fill="#FF5A5F"/>
  <text x="656" y="520" font-family="Inter, system-ui" font-size="9" font-weight="600" fill="white" text-anchor="middle">Seeker</text>
  <text x="706" y="520" font-family="Inter, system-ui" font-size="9" fill="#999" text-anchor="middle">Referrer</text>
  <circle cx="770" cy="516" r="12" fill="#E8E5E0"/>

  <!-- Welcome card -->
  <rect x="476" y="556" width="308" height="100" rx="20" fill="#FFFFFF" stroke="#E8E5E0" stroke-width="1"/>
  <text x="492" y="582" font-family="Inter, system-ui" font-size="20" font-weight="700" fill="#1A1A1A">Good morning, Rehan</text>
  <text x="492" y="602" font-family="Inter, system-ui" font-size="13" fill="#666">Ready to find your next opportunity?</text>
  <rect x="492" y="618" width="140" height="28" rx="14" fill="#FF5A5F"/>
  <text x="562" y="637" font-family="Inter, system-ui" font-size="11" font-weight="600" fill="white" text-anchor="middle">Browse Jobs</text>

  <!-- Stats - rounded soft cards -->
  <rect x="476" y="672" width="98" height="70" rx="16" fill="#FFFFFF" stroke="#E8E5E0" stroke-width="1"/>
  <text x="525" y="700" font-family="Inter, system-ui" font-size="24" font-weight="800" fill="#1A1A1A" text-anchor="middle">95</text>
  <text x="525" y="720" font-family="Inter, system-ui" font-size="10" fill="#999" text-anchor="middle">Jobs</text>

  <rect x="582" y="672" width="98" height="70" rx="16" fill="#FFFFFF" stroke="#E8E5E0" stroke-width="1"/>
  <text x="631" y="700" font-family="Inter, system-ui" font-size="24" font-weight="800" fill="#00A699" text-anchor="middle">3</text>
  <text x="631" y="720" font-family="Inter, system-ui" font-size="10" fill="#999" text-anchor="middle">Applied</text>

  <rect x="688" y="672" width="98" height="70" rx="16" fill="#FFFFFF" stroke="#E8E5E0" stroke-width="1"/>
  <text x="737" y="700" font-family="Inter, system-ui" font-size="24" font-weight="800" fill="#FF5A5F" text-anchor="middle">1</text>
  <text x="737" y="720" font-family="Inter, system-ui" font-size="10" fill="#999" text-anchor="middle">Success</text>

  <!-- Job cards - warm, rounded -->
  <text x="476" y="770" font-family="Inter, system-ui" font-size="13" font-weight="600" fill="#1A1A1A">Active Referrals</text>

  <rect x="476" y="784" width="308" height="80" rx="16" fill="#FFFFFF" stroke="#E8E5E0" stroke-width="1"/>
  <rect x="492" y="800" width="36" height="36" rx="10" fill="#FAFAF8" stroke="#E8E5E0" stroke-width="1"/>
  <text x="510" y="824" font-family="Inter, system-ui" font-size="13" font-weight="600" fill="#999" text-anchor="middle">G</text>
  <text x="540" y="816" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#1A1A1A">Sr. Software Engineer</text>
  <text x="540" y="834" font-family="Inter, system-ui" font-size="11" fill="#999">Google · Bangalore</text>
  <rect x="540" y="842" width="48" height="16" rx="8" fill="#FFB40015"/>
  <text x="564" y="853" font-family="Inter, system-ui" font-size="8" font-weight="600" fill="#CC8F00" text-anchor="middle">Pending</text>
  <text x="762" y="828" font-family="Inter, system-ui" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="end">Rs.499</text>

  <rect x="476" y="874" width="308" height="80" rx="16" fill="#FFFFFF" stroke="#E8E5E0" stroke-width="1"/>
  <rect x="492" y="890" width="36" height="36" rx="10" fill="#FAFAF8" stroke="#E8E5E0" stroke-width="1"/>
  <text x="510" y="914" font-family="Inter, system-ui" font-size="13" font-weight="600" fill="#999" text-anchor="middle">M</text>
  <text x="540" y="906" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#1A1A1A">Product Manager</text>
  <text x="540" y="924" font-family="Inter, system-ui" font-size="11" fill="#999">Microsoft · Hyderabad</text>
  <rect x="540" y="932" width="56" height="16" rx="8" fill="#00A69915"/>
  <text x="568" y="943" font-family="Inter, system-ui" font-size="8" font-weight="600" fill="#00A699" text-anchor="middle">Assigned</text>
  <text x="762" y="918" font-family="Inter, system-ui" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="end">Rs.499</text>

  <!-- Bottom nav -->
  <rect x="460" y="1140" width="340" height="50" rx="0" fill="#FFFFFF"/>
  <rect x="460" y="1140" width="340" height="1" fill="#E8E5E0"/>
  <text x="530" y="1172" font-family="Inter, system-ui" font-size="9" font-weight="600" fill="#FF5A5F" text-anchor="middle">Home</text>
  <text x="630" y="1172" font-family="Inter, system-ui" font-size="9" fill="#999" text-anchor="middle">Search</text>
  <text x="730" y="1172" font-family="Inter, system-ui" font-size="9" fill="#999" text-anchor="middle">Profile</text>

  <!-- TRAITS -->
  <text x="860" y="500" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#999">TRAITS</text>
  <text x="860" y="530" font-family="Inter, system-ui" font-size="12" fill="#666">- Light/warm cream backgrounds</text>
  <text x="860" y="550" font-family="Inter, system-ui" font-size="12" fill="#666">- Coral + teal + amber palette</text>
  <text x="860" y="570" font-family="Inter, system-ui" font-size="12" fill="#666">- Large rounded corners (16-28px)</text>
  <text x="860" y="590" font-family="Inter, system-ui" font-size="12" fill="#666">- Serif + sans-serif mix</text>
  <text x="860" y="610" font-family="Inter, system-ui" font-size="12" fill="#666">- Generous whitespace</text>
  <text x="860" y="630" font-family="Inter, system-ui" font-size="12" fill="#666">- Trust badges, friendly copy</text>
  <text x="860" y="650" font-family="Inter, system-ui" font-size="12" fill="#666">- Feels: welcoming, human, trustworthy</text>
  <text x="860" y="680" font-family="Inter, system-ui" font-size="12" font-weight="600" fill="#FF5A5F">Best for: broad audience, all demographics</text>
</svg>