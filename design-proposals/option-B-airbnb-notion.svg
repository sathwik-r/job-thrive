  <text x="460" y="470" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#999">DASHBOARD</text>

  <rect x="460" y="490" width="340" height="700" rx="28" fill="#FAFAF8" stroke="#E8E5E0" stroke-width="1"/>

